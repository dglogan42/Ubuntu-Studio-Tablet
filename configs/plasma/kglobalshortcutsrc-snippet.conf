# Merge manually or via install: tablet-friendly shortcuts
# Meta alone / bottom gesture often handled by KWin; these help keyboard docks

[kwin]
Overview=Meta+W\tMeta+Tab,none,Toggle Overview
Show Desktop=Meta+D,none,Show Desktop
Window Maximize=Meta+Up,Meta+PgUp,Maximize Window
Window Close=Meta+Q\tAlt+F4,Alt+F4,Close Window

[plasmashell]
activate application launcher=Meta\tAlt+F1,Meta,Activate Application Launcher
activate task manager entry 1=none,Meta+1,Activate Task Manager Entry 1
