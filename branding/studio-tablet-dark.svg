<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f14"/>
      <stop offset="45%" style="stop-color:#1a1030"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <rect width="1920" height="1200" fill="url(#glow)"/>
  <rect width="1920" height="1200" fill="url(#glow2)"/>
  <!-- soft grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 200 H1920 M0 400 H1920 M0 600 H1920 M0 800 H1920 M0 1000 H1920"/>
    <path d="M240 0 V1200 M480 0 V1200 M720 0 V1200 M960 0 V1200 M1200 0 V1200 M1440 0 V1200 M1680 0 V1200"/>
  </g>
  <!-- waveform motif -->
  <path d="M120 900 C 300 820, 400 980, 580 900 S 860 820, 1040 900 S 1320 980, 1500 900 S 1780 820, 1860 900"
        fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M120 940 C 300 880, 400 1000, 580 940 S 860 880, 1040 940 S 1320 1000, 1500 940 S 1780 880, 1860 940"
        fill="none" stroke="#7c5cff" stroke-opacity="0.25" stroke-width="2"/>
  <text x="96" y="120" fill="#f4f4f5" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="42" font-weight="600">Ubuntu Studio Tablet</text>
  <text x="96" y="168" fill="#a1a1aa" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="28">创作平板 · 原生应用体验</text>
